[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "if-qsaa-toolkit"
version = "1.0.0"
description = "Image-analysis and statistics core of IF-QSAA: in situ quiescent seed amplification (ThT) combined with immunofluorescence on the same tissue section"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "IF-QSAA",
    "microscopy",
    "image-analysis",
    "seed-amplification",
    "thioflavin-T",
    "immunofluorescence",
    "spatial-statistics",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.4",
    "scikit-image>=0.19",
    "tifffile>=2022.5.4",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
